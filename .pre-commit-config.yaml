# 提交时运行 Ruff、配置语法、文件大小检查。
# 安装：uv run --locked --extra dev prek install
# 手动执行：uv run --locked --extra dev prek run --all-files

repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Ruff 使用 uv.lock 中的版本，提交钩子不维护第二套版本定义。
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types: [python]
