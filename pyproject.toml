[project]
name = "dylr"
version = "4.6.0"
description = "支持抖音、TikTok、YouTube、快手等60+平台的直播录制工具，支持循环录制、多人录制、消息推送"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "oxygenkun", email = "oxygenkun.1@gmail.com" }
]
keywords = [
    "live-streaming",
    "recorder",
    "douyin",
    "tiktok",
    "bilibili",
    "twitch",
    "youtube",
    "直播录制",
    "抖音",
    "虎牙",
    "斗鱼"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Win32",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "loguru>=0.7.3",
    "pycryptodome>=3.23.0",
    "httpx[http2]>=0.28.1",
    # 显式约束 CA 证书包，避免间接依赖回落到包含受影响 emSign 根证书的版本。
    "certifi>=2026.10.19",
    # httpx 的 HTTP/2 与 SOCKS 代理会按需导入 h2 / socksio，须显式声明并维护安全下限。
    # h2 下限 >=4.4.1（2026-09-26 deps-audit「下限复核」）：PYSEC-2026-3628 / GHSA-6hr6-w5qg-qmwg
    #   （重复 Host 头 → 请求走私）fixed=4.4.1，旧下限 4.3.0 自身即在受影响段（它只修了同源的
    #   PYSEC-2026-1435）；现装与 uv.lock 均已是 4.4.1。
    "h2>=4.4.1",
    "socksio>=1.0.0",
    "exejs>=1.0.1",
    "PyExecJS>=1.5.1",
    # starlette 下限 >=1.3.1：兼顾 CVE-2026-48710（受影响 <=1.0.0）与 PYSEC-2026-2280/2281
    # （修复于 1.1.0）、PYSEC-2026-248/249（修复于 1.3.0/1.3.1）——旧下限 0.49.1、乃至补-05 抬的
    # 1.0.1 都仍放行受影响段。现装 1.8.0；审计口径见 ci.yml deps-audit「下限复核」。
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
    # 弹幕 WS 客户端：additional_headers/proxy 为 websockets 14.0+ API，下界须钉 14.0
    # （12/13.x 时 connect() 直接 TypeError 且被重连循环吞掉，弹幕永远连不上）
    "websockets>=14.0",
    # 弹幕链（src/danmaku/collector.py 工厂 + src/danmaku/platforms/ 各平台采集器 + src/proto/ 协议解码）运行时依赖：
    # protobuf 解析抖音弹幕协议（下限 6.33.5：PYSEC-2026-1805 影响 6.31.1，修复于 5.29.6 / 6.33.5；
    # 现装 7.36.2），brotli 解压 B站弹幕。上限 <8（F-14）：douyin_pb2.py 由 protoc 25.x 生成
    # （gencode 4.25.3），跨大版本升级 runtime 有 gencode 兼容窗口外失效风险，升级前须同代 protoc 重新生成。
    "protobuf>=6.33.5,<8",
    "brotli>=1.2.1",
    "pydantic>=2.12",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0.3",  # workflow YAML 解析测试
    "pytest==9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.1",
    "pip-audit>=2.10.1",
    "prek>=0.5.7",
]
# 可执行文件打包（tool/build_exe.py / CI 使用，非运行时依赖）
build = [
    "pyinstaller>=6.10.0",
]

[project.urls]
Homepage = "https://github.com/oxygenkun/dylr"
Documentation = "https://github.com/oxygenkun/dylr"
Repository = "https://github.com/oxygenkun/dylr"
Issues = "https://github.com/oxygenkun/dylr/issues"
Changelog = "https://github.com/oxygenkun/dylr/releases"
Sponsor = "https://github.com/oxygenkun"

[tool.uv]
package = false
# 开发与构建工具的间接依赖安全下限；不将它们装入运行时环境。
constraint-dependencies = [
    "filelock>=4.2.1",
    "setuptools>=84.1.0",
]

[tool.ruff]
include = ["*.py", "*.pyi"]
line-length = 120
target-version = "py314"
# 工具目录与运行期产物不属于项目源码；force-exclude 同时约束 pre-commit 显式传入的路径。
force-exclude = true
extend-exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "typings",
    "node",
    "ffmpeg",
    "downloads",
    "recordings",
    "logs",
    "backup_config",
    ".agents",
    ".plugin-src",
    ".dsh-validation",
    ".ego-browser-test",
    ".npm-cache",
    ".pnpm-store",
    ".tmp-dps-extract",
    ".brainstorm",
    "pytest-cache-files-*",
]

[tool.ruff.format]
# 本仓 CRLF / LF 混存，每个文件沿用其既有行尾，避免格式化时整文件翻转。
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle 错误
    "F",       # Pyflakes
    "I",       # 导入排序
    "UP",      # 现代 Python 写法
    "B",       # 常见缺陷
    "C4",      # 推导式与容器构造
    "PIE",     # 冗余代码
    "W",       # pycodestyle 警告
    "T10",     # 遗留调试器调用
    "RUF100",  # 已失效的 noqa
    "PGH004",  # noqa 必须指定规则编号
]
# formatter 尽量处理长行，不强拆 URL、日志及文案。
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# protoc 生成代码，不手工修改；保留生成器的编码声明与布尔比较。
"src/proto/douyin_pb2.py" = ["UP009", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # 第三方弃用提示：starlette 本体在 `starlette/testclient.py` 导入期发出（类别
    # StarletteDeprecationWarning，是 UserWarning 子类），与本项目代码无关。承重、不得删：
    # 2026-09-30 实测带 `-W default::UserWarning` 跑 tests/test_web_api.py 时 warnings summary
    # 恰落 1 条（源于该文件的 `from starlette.testclient import TestClient`）。
    # [历史注] 原注释把触发方记作「fastapi testclient 内部 import」——2026-09-29 阶段2 移除
    # fastapi/pydantic 后该归因已被证伪，告警一直由 starlette 自己发出。
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # 第三方弃用提示（anyio 4.x 的 `abc.BlockingPortal` 别名迁移到 `from_thread`）。
    # 现装组合下已不触发：starlette 1.8.0 的 testclient 三处引用一律走 `anyio.from_thread.BlockingPortal`
    # （非别名路径），且带 `-W always::DeprecationWarning`（命令行 -W 覆盖本节 ini 过滤）跑
    # tests/test_web_api.py + test_web_api_routes.py 后 warnings summary 为空。
    # 保留理由是对声明下限 starlette>=1.3.1 整段的防御——本 venv 只有 1.8.0，未验证 1.3.x 的
    # testclient 是否仍走别名路径，故不在此删；确认整段都不触发时可移除本条。
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated",
]

[tool.coverage.run]
source = ["src"]
# 本地工具生成目录与 .gitignore/.dockerignore 同源维护（.coveragerc-concurrency 的 omit 保持一致）
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/node/*",
    "*/ffmpeg/*",
    # 运行期产物目录（与 .gitignore/.dockerignore 同源维护）
    "*/downloads/*",
    "*/recordings/*",
    "*/logs/*",
    "*/backup_config/*",
    "*/.agents/*",
    "*/.pnpm-store/*",
    "*/.npm-cache/*",
    "*/.dsh-validation/*",
    "*/.ego-browser-test/*",
    "*/.plugin-src/*",
    "*/.tmp-dps-extract/*",
    "*/.brainstorm/*",
    "*/pytest-cache-files-*/*",
]

[tool.coverage.report]
fail_under = 50
# 用 exclude_also（追加）而非 exclude_lines（替换）：后者会整体丢掉 coverage 的三条默认排除
# 规则（pragma 大小写变体 / `...` 省略号函数体 / `if TYPE_CHECKING:`），使覆盖率被系统性低估。
# 四条须与 .coveragerc-concurrency（并发 job）逐条一致：pragma: no cover / def __repr__ /
# raise NotImplementedError / if __name__ == .__main__.:。
# 「if TYPE_CHECKING:」不单列——coverage 默认规则已含该写法，单列既不改结果又让两 job 条数对不齐。
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# 逐模块覆盖率阈值只在 tool/check_coverage.py 的 MODULE_THRESHOLDS 维护；此处不复制数值，避免双写漂移。
